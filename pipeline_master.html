<title>Diagrama Arquitectónico — Pipeline ETL Retail Analytics</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#080c14;
  color:#e2e8f0;
  display:flex;flex-direction:column;
}
.hdr{
  padding:.6rem 1.5rem;
  background:linear-gradient(90deg,#0f172a,#1e1b4b);
  border-bottom:1px solid #1e293b;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:10;
}
.hdr h1{font-size:1rem;font-weight:600;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-r{display:flex;gap:.4rem}
.hdr-btn{padding:.3rem .65rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:.72rem;cursor:pointer;transition:all .2s}
.hdr-btn:hover{background:#334155;color:#f1f5f9;border-color:#60a5fa}
.wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
.wrap.drag{cursor:grabbing}
.cvs{position:absolute;transform-origin:0 0;will-change:transform}
.tip{position:fixed;z-index:99;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:.6rem .8rem;max-width:320px;font-size:.74rem;color:#cbd5e1;box-shadow:0 8px 32px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .15s;line-height:1.4}
.tip.on{opacity:1}
.zc{position:absolute;bottom:1rem;right:1rem;display:flex;flex-direction:column;gap:.3rem;z-index:20}
.zb{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:1rem;cursor:pointer;transition:all .2s}
.zb:hover{background:#334155;color:#f1f5f9;border-color:#60a5fa}
</style>
</head>

<script>
(function(){
  const W=document.getElementById('W'),C=document.getElementById('C'),T=document.getElementById('T');
  let s=.7,tx=0,ty=0,pan=false,sx,sy;
  function ap(){C.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
  ap();
  W.addEventListener('mousedown',e=>{if(e.target.closest('.zb')||e.target.closest('.hdr-btn'))return;pan=true;sx=e.clientX-tx;sy=e.clientY-ty;W.classList.add('drag')});
  window.addEventListener('mousemove',e=>{if(!pan)return;tx=e.clientX-sx;ty=e.clientY-sy;ap()});
  window.addEventListener('mouseup',()=>{pan=false;W.classList.remove('drag')});
  W.addEventListener('wheel',e=>{e.preventDefault();const r=W.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,wx=(mx-tx)/s,wy=(my-ty)/s,d=e.deltaY<0?1.08:1/1.08;s=Math.min(Math.max(s*d,.2),3);tx=mx-wx*s;ty=my-wy*s;ap()},{passive:false});
  window.zi=()=>{s=Math.min(s*1.15,3);ap()};
  window.zo=()=>{s=Math.max(s/1.15,.2);ap()};
  window.rst=()=>{s=.7;tx=0;ty=0;ap()};
  window.fit=()=>{const r=W.getBoundingClientRect();s=Math.min(r.width/1900,r.height/1000)*.92;tx=(r.width-1900*s)/2;ty=(r.height-1000*s)/2;ap()};
  document.querySelectorAll('.nd').forEach(n=>{
    n.addEventListener('mouseenter',()=>{const t=n.getAttribute('data-t');if(!t)return;T.innerHTML=t.replace(/\n/g,'<br>');T.classList.add('on')});
    n.addEventListener('mousemove',e=>{let x=e.clientX+14,y=e.clientY+14;if(x+320>window.innerWidth)x=e.clientX-330;if(y+180>window.innerHeight)y=e.clientY-180;T.style.left=x+'px';T.style.top=y+'px'});
    n.addEventListener('mouseleave',()=>T.classList.remove('on'));
  });
  window.addEventListener('load',()=>setTimeout(fit,150));
})();
</script>
